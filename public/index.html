<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GG Flow Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/edit.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect x='3' y='10' width='22' height='15' rx='3' fill='%238c2f5b'/%3E%3Cpath d='M3.8 6.9 22.6 3l1.1 4.6L4.9 11.5z' fill='%238c2f5b' opacity='.55'/%3E%3Cpath d='m11 14.5 6 3.5-6 3.5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  /* Layout idea: slim header, a run bar, then a workspace of shot list (left) and shot detail (right).
     Neutrals lean plum, one berry accent; green/amber/red/blue/teal are reserved for state. */
  :root {
    --bg: #f5f3f6;
    --surface: #ffffff;
    --surface-2: #faf8fb;
    --line: #e7e2ea;
    --line-strong: #d3ccd8;
    --ink: #241e29;
    --ink-2: #5a5062;
    --ink-3: #766c7e;
    --accent: #8c2f5b;
    --accent-hover: #72244a;
    --accent-soft: #f7e8ef;
    --ok: #1b7447;      --ok-soft: #e1f2e9;
    --warn: #8f5500;    --warn-soft: #fbeed4;
    --bad: #b3261e;     --bad-soft: #fbe5e2;
    --work: #2a5ca3;    --work-soft: #e2ebf8;
    --video: #0e6f66;   --video-soft: #d9f1ee;
    --radius: 8px;
    --shadow: 0 1px 2px rgba(36,30,41,.06), 0 1px 3px rgba(36,30,41,.05);
    --shadow-lg: 0 10px 28px rgba(36,30,41,.16);
    --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-display: 'Bricolage Grotesque', 'Be Vietnam Pro', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: var(--font-body); font-size: 14px; line-height: 1.5; background: var(--bg); color: var(--ink); display: flex; flex-direction: column; overflow: hidden; -webkit-font-smoothing: antialiased; }
  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header */
  .app-header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; padding: 8px 20px; min-height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; z-index: 10; }
  .brand { display: flex; align-items: center; gap: 9px; cursor: pointer; border: 0; background: none; padding: 0; color: var(--ink); font-family: var(--font-display); font-size: 19px; font-weight: 700; letter-spacing: -.01em; min-height: 36px; }
  .brand-mark { width: 26px; height: 26px; color: var(--accent); flex-shrink: 0; }
  .crumb-sep { color: var(--line-strong); font-size: 18px; }
  .crumb-name { font-family: var(--font-display); font-weight: 600; font-size: 17px; min-width: 0; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb-meta { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1 1 auto; }
  .header-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }

  /* Buttons */
  button { font-family: inherit; }
  .header-actions button, .dialog-actions button, .empty-state button, .page-head button, .btn-sm { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 15px; border-radius: 7px; border: 1px solid transparent; cursor: pointer; font-size: 13.5px; font-weight: 600; line-height: 1; transition: background .15s, border-color .15s, color .15s, box-shadow .15s; }
  .btn-sm { min-height: 30px; padding: 0 11px; font-size: 12.5px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-danger { background: var(--surface); color: var(--bad); border-color: #e3b4b0 !important; }
  .btn-danger:hover { background: var(--bad-soft); }
  .btn-outline, .btn-import { background: var(--surface); color: var(--ink); border-color: var(--line-strong) !important; }
  .btn-outline:hover, .btn-import:hover { border-color: var(--accent) !important; color: var(--accent); background: var(--accent-soft); }
  .btn-primary:disabled, .btn-danger:disabled { background: var(--surface-2); color: var(--ink-3); border-color: var(--line) !important; cursor: not-allowed; }
  .btn-success { background: var(--ok); color: #fff; }
  .link-btn { background: none; border: 0; color: var(--accent); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 4px 6px; border-radius: 5px; }
  .link-btn:hover { background: var(--accent-soft); }

  /* Status badge */
  .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .status-badge::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status-idle, .status-created { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
  .status-running { background: var(--work-soft); color: var(--work); }
  .status-running::before { animation: pulse 1.4s infinite; }
  .status-stopping, .status-stopped { background: var(--warn-soft); color: var(--warn); }
  .status-completed { background: var(--ok-soft); color: var(--ok); }
  .status-error { background: var(--bad-soft); color: var(--bad); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }

  /* Chips and tags */
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; padding: 1px 8px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .chip-face-yes { background: var(--accent-soft); border-color: #ecc9d9; color: var(--accent); font-weight: 600; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; font-weight: 700; letter-spacing: .04em; }
  .tag-vid { background: var(--video-soft); color: var(--video); }
  .tag-img { background: var(--work-soft); color: var(--work); }
  .tag-stock { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
  .tag-step { font-size: 11.5px; padding: 1px 9px; border-radius: 10px; font-weight: 600; }
  .step-waiting { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
  .step-image-gen, .step-image-download { background: var(--work-soft); color: var(--work); }
  .step-video-gen, .step-video-download { background: var(--video-soft); color: var(--video); }
  .step-complete { background: var(--ok-soft); color: var(--ok); }
  .step-failed { background: var(--bad-soft); color: var(--bad); }

  /* Run bar */
  .runbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .stats { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; }
  .stat { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--ink-2); }
  .stat b { font-family: var(--font-display); font-size: 21px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat-photos { border: 1px solid; border-radius: 16px; padding: 3px 12px 3px 10px; cursor: pointer; background: none; font: inherit; align-items: center; font-size: 12.5px; font-weight: 600; }
  .stat-photos b { font-size: 14px; color: inherit; }
  .stat-photos.ok { color: var(--ok); background: var(--ok-soft); border-color: #bfe0cd; }
  .stat-photos.warn { color: var(--warn); background: var(--warn-soft); border-color: #ecd29b; }
  .settings { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .field { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
  select { font: inherit; font-size: 13px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 7px; min-height: 30px; padding: 0 8px; cursor: pointer; }
  select:hover { border-color: var(--accent); }
  .toggle { position: relative; }
  .toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle span { display: inline-flex; align-items: center; min-height: 30px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 16px; background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--ink-2); cursor: pointer; transition: all .15s; }
  .toggle span:hover { border-color: var(--accent); }
  .toggle input:checked + span { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .toggle input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Workspace */
  .main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; flex: 1; min-height: 0; }
  .left-panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); }
  .tabs { display: flex; gap: 2px; background: var(--surface); border-bottom: 1px solid var(--line); flex-shrink: 0; padding: 0 12px; }
  .tab { display: inline-flex; align-items: center; gap: 7px; padding: 12px 12px 10px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); cursor: pointer; background: none; border: 0; border-bottom: 2px solid transparent; transition: color .15s; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .count { font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 0 7px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); }
  .tab.active .count { background: var(--accent-soft); border-color: #ecc9d9; color: var(--accent); }
  .tab-content { flex: 1; overflow-y: auto; min-height: 0; }

  /* Shot list */
  .list-toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 3; font-size: 12.5px; color: var(--ink-2); }
  .list-toolbar .spacer { flex: 1; }
  input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; flex-shrink: 0; }
  .shot-group { display: flex; align-items: center; gap: 12px; padding: 9px 16px; background: var(--bg); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); position: sticky; top: 41px; z-index: 2; }
  .shot-group .g-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; }
  .shot-group .g-meta { font-size: 12px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
  .shot { display: grid; grid-template-columns: 16px 42px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .1s; }
  .shot:hover { background: var(--surface-2); }
  .shot.selected { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .shot-num { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13px; color: var(--accent); padding-top: 1px; }
  .shot-title { font-size: 14px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .shot-title .code { font-variant-numeric: tabular-nums; color: var(--ink-3); font-weight: 500; margin-right: 6px; }
  .shot-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .shot-prompt { color: var(--ink-3); font-size: 12.5px; margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shot-side { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }

  /* People (reference photos) */
  .photo-hint { margin: 14px 16px 4px; padding: 10px 14px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; color: var(--ink-2); line-height: 1.55; }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; padding: 14px 16px 20px; }
  .person { display: flex; gap: 16px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); min-width: 0; }
  .photo-drop { width: 104px; height: 132px; border: 2px dashed var(--line-strong); border-radius: 10px; background: var(--surface-2); display: flex; align-items: center; justify-content: center; text-align: center; font-size: 12px; line-height: 1.35; color: var(--ink-3); cursor: pointer; overflow: hidden; flex-shrink: 0; transition: all .15s; padding: 6px; }
  .photo-drop:hover, .photo-drop.drag { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .photo-drop:has(img) { border-style: solid; border-color: var(--line); padding: 0; }
  .photo-drop img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .person-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; align-items: flex-start; }
  .person-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.2; }
  .person-id { font-size: 12px; color: var(--ink-3); font-weight: 500; margin-left: 6px; font-family: var(--font-body); }
  .photo-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 12px; }
  .photo-ok { background: var(--ok-soft); color: var(--ok); }
  .photo-excel { background: var(--warn-soft); color: var(--warn); }
  .photo-none { background: var(--bad-soft); color: var(--bad); }
  .photo-path { word-break: break-all; color: var(--ink-3); font-size: 12px; line-height: 1.45; }
  .photo-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; }
  .photo-actions button { min-height: 32px; padding: 0 12px; font-size: 12.5px; font-weight: 600; border-radius: 7px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; color: var(--ink); }
  .photo-actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .photo-actions button:disabled { opacity: .45; cursor: not-allowed; }

  /* Right panel */
  .right-panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface-2); border-left: 1px solid var(--line); }
  .right-panel .tabs { background: var(--surface-2); }
  .right-tab-content { flex: 1; overflow-y: auto; min-height: 0; }

  /* Detail */
  .detail-content { padding: 18px 20px 28px; }
  .detail-empty { color: var(--ink-3); font-size: 13.5px; text-align: center; margin-top: 56px; }
  .detail-eyebrow { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
  .detail-title { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.25; margin: 8px 0 14px; text-wrap: balance; letter-spacing: -.01em; }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
  .fact { background: var(--surface); padding: 9px 12px; min-width: 0; }
  .fact-label { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }
  .fact-value { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .detail-field { margin-bottom: 16px; }
  .detail-label { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
  .detail-label small { font-weight: 400; color: var(--ink-3); }
  .prompt-edit { width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; resize: vertical; min-height: 108px; max-height: 420px; font-family: inherit; line-height: 1.6; transition: border-color .15s, box-shadow .15s; }
  .prompt-edit:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(140,47,91,.14); }

  .stepper { display: flex; align-items: center; gap: 0; margin-top: 4px; }
  .stepper .st { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-3); }
  .stepper .st i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--surface); display: grid; place-items: center; font-style: normal; font-size: 11px; line-height: 1; color: #fff; }
  .stepper .bar { flex: 1; height: 2px; background: var(--line-strong); margin: 0 10px; min-width: 18px; }
  .stepper .st.done { color: var(--ok); }
  .stepper .st.done i { background: var(--ok); border-color: var(--ok); }
  .stepper .st.done + .bar { background: var(--ok); }
  .stepper .st.now { color: var(--work); }
  .stepper .st.now i { border-color: var(--work); box-shadow: 0 0 0 3px var(--work-soft); }
  .stepper .st.fail { color: var(--bad); }
  .stepper .st.fail i { background: var(--bad); border-color: var(--bad); }

  /* Log */
  .log-toolbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
  .log-content { padding: 10px 14px; font-family: var(--font-mono); font-size: 12px; line-height: 1.65; background: #1d1a21; color: #cfc8d6; min-height: calc(100% - 41px); }
  .log-entry { white-space: pre-wrap; word-break: break-word; }
  .log-info { color: #a79eb0; }
  .log-success { color: #5fd49a; }
  .log-warn { color: #f0c05a; }
  .log-error { color: #ff8f86; }

  /* Results + status bar */
  .results-bar { display: flex; gap: 8px; padding: 8px 20px; background: var(--surface); border-top: 1px solid var(--line); overflow-x: auto; flex-shrink: 0; align-items: center; }
  .results-bar:empty { display: none; }
  .results-bar h4 { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; margin-right: 4px; font-weight: 600; }
  .result-thumb { width: 64px; height: 36px; object-fit: cover; border-radius: 6px; border: 2px solid var(--line); cursor: pointer; flex-shrink: 0; transition: all .15s; }
  .result-thumb:hover { border-color: var(--accent); transform: scale(1.05); box-shadow: var(--shadow-lg); }
  .statusbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 20px; min-height: 32px; background: var(--surface); border-top: 1px solid var(--line); flex-shrink: 0; font-size: 12.5px; color: var(--ink-2); }
  .statusbar .meter { display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
  .statusbar .meter i { display: block; width: 120px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .statusbar .meter i b { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }

  /* Empty state */
  .empty-state { text-align: center; padding: 72px 24px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .empty-mark { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; margin-bottom: 10px; }
  .empty-mark svg { width: 28px; height: 28px; }
  .empty-state h2 { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
  .empty-state p { font-size: 13.5px; color: var(--ink-2); max-width: 36ch; margin-bottom: 14px; }

  /* Home */
  .home-content { flex: 1; overflow-y: auto; }
  .page { max-width: 1180px; margin: 0 auto; padding: 28px 20px 40px; }
  .page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .page-head h2 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -.015em; line-height: 1.1; }
  .page-head p { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }
  .flow-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .flow-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 14px; cursor: pointer; transition: border-color .15s, box-shadow .15s, transform .15s; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .flow-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line-strong); }
  .flow-card.s-running::before { background: var(--work); }
  .flow-card.s-completed::before { background: var(--ok); }
  .flow-card.s-error::before { background: var(--bad); }
  .flow-card.s-stopped::before { background: var(--warn); }
  .flow-card:hover { border-color: var(--accent); box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .flow-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .flow-card-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
  .flow-card-stats { display: flex; align-items: baseline; gap: 6px; color: var(--ink-2); font-size: 13px; }
  .flow-card-stats b { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; line-height: 1; }
  .flow-card-stats .none { font-size: 13.5px; color: var(--ink-3); }
  .flow-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
  .flow-card-actions { display: flex; gap: 2px; margin-right: -6px; }
  .flow-card-actions button { display: grid; place-items: center; width: 32px; height: 32px; background: none; border: 0; border-radius: 6px; cursor: pointer; color: var(--ink-3); transition: all .15s; }
  .flow-card-actions button svg { width: 16px; height: 16px; }
  .flow-card-actions button:hover { background: var(--surface-2); color: var(--accent); }
  .flow-card-actions .fc-delete:hover { background: var(--bad-soft); color: var(--bad); }

  /* Modal (media viewer) */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(20,14,24,.62); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-overlay.active { display: flex; }
  .modal { background: var(--surface); border-radius: 12px; max-width: 90vw; max-height: 90vh; overflow: auto; box-shadow: var(--shadow-lg); }
  .modal img, .modal video { max-width: 90vw; max-height: 85vh; display: block; border-radius: 8px; }

  /* Dialog */
  .dialog-overlay { display: none; position: fixed; inset: 0; background: rgba(20,14,24,.45); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(3px); padding: 16px; }
  .dialog-overlay.active { display: flex; }
  .dialog { background: var(--surface); border-radius: 12px; padding: 24px; width: min(440px, 100%); box-shadow: var(--shadow-lg); }
  .dialog h3 { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin-bottom: 12px; }
  .dialog p { font-size: 14px; color: var(--ink-2); margin-bottom: 18px; line-height: 1.55; white-space: pre-line; }
  .dialog input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--radius); font-size: 14px; font-family: inherit; margin: 8px 0 18px; color: var(--ink); background: var(--surface); }
  .dialog input[type="text"]:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px rgba(140,47,91,.14); }
  .dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .dialog-actions button { min-width: 84px; }

  #fileInput { display: none; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink-3); }

  /* Toast */
  .toast-container { position: fixed; top: 16px; right: 16px; z-index: 300; display: flex; flex-direction: column; gap: 8px; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-radius: 9px; background: var(--ink); color: #fff; box-shadow: var(--shadow-lg); font-size: 13px; min-width: 260px; max-width: 400px; animation: toast-in .25s ease; }
  .toast.removing { animation: toast-out .2s ease forwards; }
  .toast-icon { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0; margin-top: 1px; color: var(--ink); }
  .toast-success .toast-icon { background: #5fd49a; }
  .toast-error .toast-icon { background: #ff8f86; }
  .toast-info .toast-icon { background: #a9c7f5; }
  .toast-msg { flex: 1; line-height: 1.45; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(-8px); } }

  /* Button loading */
  .btn-loading { position: relative; color: transparent !important; pointer-events: none; }
  .btn-loading::after { content: ''; position: absolute; inset: 0; margin: auto; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .6s linear infinite; }
  .btn-outline.btn-loading::after, .btn-import.btn-loading::after { border-color: rgba(0,0,0,.15); border-top-color: var(--accent); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Narrow screens: one column, page scrolls */
  @media (max-width: 900px) {
    body { overflow: auto; display: block; height: auto; min-height: 100%; }
    #app { display: block; }
    .app-header { padding: 8px 14px; }
    .runbar { padding: 10px 14px; }
    .settings { margin-left: 0; }
    .main { display: block; }
    .tab-content { overflow: visible; }
    .right-tab-content { overflow: visible; }
    .right-panel { border-left: 0; border-top: 1px solid var(--line); scroll-margin-top: 8px; }
    .shot-group, .list-toolbar { position: static; }
    .people { grid-template-columns: 1fr; padding: 12px; }
    .home-content { overflow: visible; }
    .statusbar { position: sticky; bottom: 0; }
  }
  @media (max-width: 600px) {
    .brand .word { display: none; }
    .header-actions { width: 100%; }
    .header-actions button { flex: 1; }
    .shot { grid-template-columns: 16px 34px minmax(0, 1fr); }
    .shot-side { grid-column: 3; flex-direction: row; align-items: center; }
    .person { flex-direction: column; }
    .photo-drop { width: 100%; height: 160px; }
    .stat b { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div id="app"></div>

<div class="modal-overlay" id="modal" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()" id="modalContent"></div>
</div>

<div class="dialog-overlay" id="dialogOverlay">
  <div class="dialog" id="dialogBox"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="/timeline.cjs"></script>
<script src="/edit.js"></script>
<script>
// ─── Toast & Loading ─────────────────────────────────────
const TOAST_ICONS = { success: '✓', error: '!', info: 'i' };
function showToast(message, type = 'info', duration = 3500) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.innerHTML = '<span class="toast-icon">' + (TOAST_ICONS[type] || '') + '</span><span class="toast-msg">' + esc(message) + '</span>';
  c.appendChild(t);
  setTimeout(() => { t.classList.add('removing'); setTimeout(() => t.remove(), 250); }, duration);
}

async function withLoading(btn, asyncFn, restoreDisabled = true) {
  if (!btn) return asyncFn();
  const wasDis = btn.disabled;
  btn.classList.add('btn-loading');
  btn.disabled = true;
  try { return await asyncFn(); }
  catch (e) { showToast(e.message || 'Something went wrong', 'error'); throw e; }
  finally { btn.classList.remove('btn-loading'); if (restoreDisabled) btn.disabled = wasDis; }
}

// ─── Routing ─────────────────────────────────────────────
const API = '/api/flows';
let currentFlowId = null;

function getFlowIdFromUrl() {
  const m = window.location.pathname.match(/^\/flow\/([a-f0-9-]+)/);
  return m ? m[1] : null;
}

function navigate(path) {
  window.history.pushState({}, '', path);
  route();
}

function route() {
  currentFlowId = getFlowIdFromUrl();
  if (window.Ed) Ed.leave(); // thoát view Dựng (lưu dở, đóng kết nối)
  if (eventSource) { eventSource.close(); eventSource = null; }
  if (currentFlowId) {
    if (/\/edit\/?$/.test(window.location.pathname)) Ed.render(); else renderFlowView();
  } else {
    renderHomeView();
  }
}

window.addEventListener('popstate', route);

// ─── HOME VIEW ───────────────────────────────────────────
let allFlows = [];

async function loadFlows() {
  const res = await fetch(API);
  allFlows = await res.json();
}

const BRAND_SVG = '<svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="10" width="22" height="15" rx="3" fill="currentColor"/><path d="M3.8 6.9 22.6 3l1.1 4.6L4.9 11.5z" fill="currentColor" opacity=".55"/><path d="m11 14.5 6 3.5-6 3.5z" fill="#fff"/></svg>';
const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';
const ICON_FILM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M17 9h4M3 15h4M17 15h4"/></svg>';
const STATUS_LABEL = { idle: 'Idle', created: 'Draft', running: 'Running', stopping: 'Stopping', stopped: 'Stopped', completed: 'Completed', error: 'Error' };
function statusLabel(st) { return STATUS_LABEL[st] || st; }

function renderHomeView() {
  document.getElementById('app').innerHTML = `
    <header class="app-header">
      <button class="brand" onclick="navigate('/')" aria-label="GG Flow home">${BRAND_SVG}<span class="word">GG Flow</span></button>
      <div class="header-actions">
        <button class="btn-outline" onclick="doLogin()" title="Opens a browser window to sign in to Google Flow">Sign in to Flow</button>
        <button class="btn-primary" onclick="createFlow()">New flow</button>
      </div>
    </header>
    <main class="home-content" id="homeContent"><div class="page"><p style="color:var(--ink-3)">Loading…</p></div></main>
  `;
  loadFlows().then(renderFlowList);
}

function renderFlowList() {
  const el = document.getElementById('homeContent');
  if (!el) return;

  if (!allFlows.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-mark">${ICON_FILM}</div>
        <h2>No flows yet</h2>
        <p>A flow turns one Excel of scenes into images and videos on Google Flow.</p>
        <button class="btn-primary" onclick="createFlow()">New flow</button>
      </div>`;
    return;
  }

  const cards = allFlows.map(f => {
    const when = new Date(f.updatedAt || f.createdAt).toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    const stats = f.hasExcel ? `<b>${f.sceneCount}</b> scenes` : `<span class="none">No Excel imported yet</span>`;
    return `
      <article class="flow-card s-${esc(f.status)}" tabindex="0" onclick="navigate('/flow/${f.id}')" onkeydown="if(event.target===this&&event.key==='Enter')navigate('/flow/${f.id}')">
        <div class="flow-card-top">
          <span class="flow-card-name">${esc(f.name)}</span>
          <span class="status-badge status-${esc(f.status)}">${esc(statusLabel(f.status))}</span>
        </div>
        <div class="flow-card-stats">${stats}</div>
        <div class="flow-card-foot">
          <span>Updated ${esc(when)}</span>
          <span class="flow-card-actions">
            <button class="fc-clone" onclick="event.stopPropagation();cloneFlow('${f.id}')" title="Duplicate" aria-label="Duplicate flow">${ICON_COPY}</button>
            <button class="fc-delete" onclick="event.stopPropagation();deleteFlow('${f.id}')" title="Delete" aria-label="Delete flow">${ICON_TRASH}</button>
          </span>
        </div>
      </article>`;
  }).join('');

  el.innerHTML = `<div class="page">
    <div class="page-head"><div><h2>Flows</h2><p>${allFlows.length} ${allFlows.length === 1 ? 'flow' : 'flows'}. Each one holds an Excel of scenes, reference photos and the generated output.</p></div></div>
    <div class="flow-grid">${cards}</div></div>`;
}

function createFlow() {
  showPromptDialog('Create Flow', 'Flow name:', '', async (name) => {
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name || undefined }),
      });
      if (!res.ok) throw new Error('Failed to create flow');
      const meta = await res.json();
      showToast('Flow created!', 'success');
      navigate('/flow/' + meta.id);
    } catch (e) { showToast(e.message, 'error'); }
  });
}

async function cloneFlow(id) {
  const flow = allFlows.find(f => f.id === id);
  const name = flow ? flow.name : 'Flow';
  try {
    const res = await fetch(API + '/' + id + '/clone', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name + ' (copy)' }),
    });
    if (!res.ok) throw new Error('Failed to clone flow');
    showToast('Flow cloned!', 'success');
    await loadFlows();
    renderFlowList();
  } catch (e) { showToast(e.message, 'error'); }
}

function deleteFlow(id) {
  showConfirmDialog('Delete Flow', 'Delete this flow and all its data? This cannot be undone.', async () => {
    try {
      const res = await fetch(API + '/' + id, { method: 'DELETE' });
      if (!res.ok) throw new Error('Failed to delete flow');
      allFlows = allFlows.filter(f => f.id !== id);
      showToast('Flow deleted', 'success');
      renderFlowList();
    } catch (e) { showToast(e.message, 'error'); }
  });
}

// ─── FLOW VIEW ───────────────────────────────────────────
let scenes = [], characters = [], selectedScene = null, engineState = 'idle', sceneStatuses = {};
let currentTab = 'scenes', currentRightTab = 'detail', logEntries = [];
let eventSource = null;
let flowMeta = null;
let pickedScenes = new Set(), pickedInit = false; // cảnh được chọn để chạy (giữ qua các lần vẽ lại)

function apiUrl(path) { return API + '/' + currentFlowId + '/' + path; }

async function renderFlowView() {
  // Reset state
  scenes = []; characters = []; selectedScene = null; sceneStatuses = {};
  logEntries = []; engineState = 'idle'; pickedScenes = new Set(); pickedInit = false;

  // Close previous SSE
  if (eventSource) { eventSource.close(); eventSource = null; }

  // Load flow meta
  const metaRes = await fetch(API + '/' + currentFlowId);
  if (!metaRes.ok) { navigate('/'); return; }
  flowMeta = await metaRes.json();

  document.getElementById('app').innerHTML = `
    <header class="app-header">
      <button class="brand" onclick="navigate('/')" aria-label="All flows">${BRAND_SVG}<span class="word">GG Flow</span></button>
      <span class="crumb-sep" aria-hidden="true">/</span>
      <div class="crumb-meta">
        <h1 class="crumb-name">${esc(flowMeta.name)}</h1>
        <span id="statusBadge" class="status-badge status-${esc(flowMeta.status)}">${esc(statusLabel(flowMeta.status))}</span>
      </div>
      <div class="seg" role="tablist" aria-label="Giai đoạn"><button role="tab" class="on" aria-selected="true">Generate</button><button role="tab" onclick="navigate('/flow/${currentFlowId}/edit')">Edit</button></div>
      <div class="header-actions">
        <button class="btn-import" onclick="document.getElementById('fileInput').click()">Import Excel</button>
        <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="uploadExcel(this)">
        <button class="btn-primary" id="btnStart" onclick="doStart()" disabled>Start</button>
        <button class="btn-danger" id="btnStop" onclick="doStop()" disabled>Stop</button>
      </div>
    </header>
    <div class="runbar" id="summaryBar" style="display:none">
      <div class="stats">
        <span class="stat" id="sumScenes"></span>
        <span class="stat" id="sumChars"></span>
        <button class="stat stat-photos" id="sumPhotos" onclick="goToCharacters()"></button>
        <span class="stat" id="sumTypes"></span>
      </div>
      <div class="settings">
        <label class="field">Ratio <select id="ratio"><option value="16:9" selected>16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select></label>
        <label class="field">Outputs <select id="genCount"><option value="1" selected>1 per scene</option><option value="2">2 per scene</option></select></label>
        <label class="toggle"><input type="checkbox" id="imageOnly"><span>Images only</span></label>
        <label class="toggle"><input type="checkbox" id="videoOnly"><span>Videos only</span></label>
        <label class="toggle"><input type="checkbox" id="resume"><span>Resume</span></label>
      </div>
    </div>
    <div class="main">
      <section class="left-panel">
        <div class="tabs" role="tablist">
          <button class="tab active" role="tab" onclick="switchTab('scenes',this)">Scenes <span class="count" id="cntScenes">0</span></button>
          <button class="tab" role="tab" id="tabChars" onclick="switchTab('chars',this)">Characters <span class="count" id="cntChars">0</span></button>
        </div>
        <div class="tab-content" id="tabContent">${emptyScenesHtml()}</div>
      </section>
      <aside class="right-panel" id="rightPanel">
        <div class="right-tabs tabs" role="tablist">
          <button class="tab active" role="tab" onclick="switchRightTab('detail',this)">Detail</button>
          <button class="tab" role="tab" onclick="switchRightTab('log',this)">Log</button>
        </div>
        <div class="right-tab-content" id="rightContent">
          <div class="detail-content"><div class="detail-empty">Select a scene to see its prompts and progress.</div></div>
        </div>
      </aside>
    </div>
    <div class="results-bar" id="resultsBar"></div>
    <footer class="statusbar"><span id="bottomStats">Import an Excel file to start</span><span class="meter" id="progressStats"></span></footer>
  `;

  await loadFlowData();
  connectFlowSSE();
  requestNotificationPermission();
  loadResults();
}

async function uploadExcel(input) {
  const f = input.files[0]; if (!f) return;
  const btn = document.querySelector('.btn-import');
  await withLoading(btn, async () => {
    const res = await fetch(apiUrl('upload'), { method: 'POST', body: await f.arrayBuffer() });
    const data = await res.json();
    input.value = '';
    if (!res.ok) {
      const msg = data.details ? data.details.join('\n') : data.error;
      showAlertDialog('Import Failed', msg);
      return;
    }
    showToast('Excel imported successfully', 'success');
    pickedInit = false;
    await loadFlowData();
  });
}

async function loadFlowData() {
  try {
    const [sR, cR] = await Promise.all([fetch(apiUrl('scenes')), fetch(apiUrl('characters'))]);
    if (!sR.ok || !cR.ok) throw new Error('Failed to load data');
    scenes = await sR.json(); characters = await cR.json();
    if (!pickedInit) { pickedScenes = new Set(scenes.map(x => x.sceneNumber)); pickedInit = true; }
    renderSummary(); renderLeft();
    const btnStart = document.getElementById('btnStart');
    if (btnStart) btnStart.disabled = !scenes.length;
    if (scenes.length && !selectedScene) selectScene(scenes[0].sceneNumber);
  } catch (e) { showToast('Failed to load flow data', 'error'); }
}

function emptyScenesHtml() {
  return '<div class="empty-state"><div class="empty-mark">' + ICON_FILM + '</div><h2>No scenes yet</h2><p>Import the Excel file to load its scenes and characters.</p><button class="btn-import" onclick="document.getElementById(\'fileInput\').click()">Import Excel</button></div>';
}

function renderSummary() {
  const bar = document.getElementById('summaryBar');
  const cs = document.getElementById('cntScenes'), cc = document.getElementById('cntChars');
  if (cs) cs.textContent = scenes.length;
  if (cc) cc.textContent = characters.length;
  if (!bar) return;
  if (!scenes.length) { bar.style.display = 'none'; return; }
  bar.style.display = '';
  const n = t => scenes.filter(s => s.type === t).length;
  const v = n('AI-VID'), i = n('AI-IMG'), k = n('STOCK');
  document.getElementById('sumScenes').innerHTML = '<b>' + scenes.length + '</b> scenes';
  document.getElementById('sumChars').innerHTML = '<b>' + characters.length + '</b> characters';
  const ready = characters.filter(c => c.photoSource === 'upload' || c.photoSource === 'excel').length;
  const sp = document.getElementById('sumPhotos');
  sp.style.display = characters.length ? '' : 'none';
  sp.className = 'stat stat-photos ' + (ready === characters.length ? 'ok' : 'warn');
  sp.title = ready === characters.length ? 'Every character has a reference photo' : 'Some characters have no reference photo. Click to fix.';
  sp.innerHTML = '<b>' + ready + '/' + characters.length + '</b>&nbsp;reference photos';
  const t = []; if (v) t.push('<span class="tag tag-vid">' + v + ' video</span>'); if (i) t.push('<span class="tag tag-img">' + i + ' image</span>'); if (k) t.push('<span class="tag tag-stock">' + k + ' stock</span>');
  document.getElementById('sumTypes').innerHTML = t.join(' ');
}

function goToCharacters() { const b = document.getElementById('tabChars'); if (b) b.click(); }
function switchTab(t, el) { currentTab = t; document.querySelectorAll('.left-panel .tab').forEach(x => x.classList.remove('active')); el.classList.add('active'); renderLeft(); }
function switchRightTab(t, el) { currentRightTab = t; document.querySelectorAll('.right-panel .tabs .tab').forEach(x => x.classList.remove('active')); el.classList.add('active'); renderRight(); }

function renderLeft() {
  const el = document.getElementById('tabContent');
  if (!el) return;
  if (!scenes.length) { el.onclick = el.onchange = null; el.innerHTML = emptyScenesHtml(); return; }
  currentTab === 'scenes' ? renderScenes(el) : renderChars(el);
}

// Tên cảnh do bộ prompt tạo ra: "A1.04 · Chương 1 · Chiến Quốc · vừa-rộng · dùng 3,5 s · mặt: có".
// Tách được thì hiện thành chip và gom theo chương; không tách được thì hiện nguyên tên.
function parseShot(name) {
  const p = String(name || '').split(' · ').map(x => x.trim());
  const n = p.length;
  if (n >= 5 && /^dùng\s/i.test(p[n - 2]) && /^mặt\s*:/i.test(p[n - 1])) {
    return { code: p[0], chapter: p.slice(1, n - 3).join(' · '), size: p[n - 3], dur: p[n - 2].replace(/^dùng\s*/i, ''), face: /có/i.test(p[n - 1]) };
  }
  return null;
}

let groupIndex = {};
function renderScenes(el) {
  const info = scenes.map(s => ({ s, p: parseShot(s.sceneName) }));
  const grouped = info.some(x => x.p);
  const keyOf = x => grouped ? (x.p ? x.p.chapter : 'Other') : '';
  const mixed = new Set(scenes.map(s => s.type)).size > 1;

  groupIndex = {};
  info.forEach(x => {
    const g = groupIndex[keyOf(x)] || (groupIndex[keyOf(x)] = { n: 0, sec: 0, nums: [] });
    g.n++; g.nums.push(x.s.sceneNumber);
    g.sec += x.p ? (parseFloat(x.p.dur.replace(',', '.')) || 0) : (Number(x.s.duration) || 0);
  });

  const picked = scenes.filter(s => pickedScenes.has(s.sceneNumber)).length;
  let html = '<div class="list-toolbar"><input type="checkbox" id="selAll" aria-label="Select all scenes">' +
    '<span id="selCount">' + picked + ' of ' + scenes.length + ' selected</span><span class="spacer"></span>' +
    '<button class="link-btn" data-act="first6" title="Select only the first 6 scenes for a quick trial run">First 6 only</button></div>';

  let last = null;
  info.forEach(({ s, p }) => {
    const k = keyOf({ s, p });
    if (grouped && k !== last) {
      const g = groupIndex[k];
      html += '<div class="shot-group"><input type="checkbox" class="grp-check" data-key="' + esc(k) + '" aria-label="Select ' + esc(k) + '">' +
        '<span class="g-name">' + esc(k) + '</span><span class="g-meta">' + g.n + (g.n === 1 ? ' shot · ' : ' shots · ') + (Math.round(g.sec * 10) / 10) + ' s</span></div>';
      last = k;
    }
    const num = s.sceneNumber;
    const st = sceneStatuses[num] || '';
    const status = st && st !== 'waiting' ? '<span class="tag-step step-' + st + '">' + esc(st) + '</span>' : '';
    const typeTag = mixed ? '<span class="tag ' + (s.type === 'AI-VID' ? 'tag-vid' : s.type === 'AI-IMG' ? 'tag-img' : 'tag-stock') + '">' + esc(s.type.replace('AI-', '')) + '</span>' : '';
    const who = (s.characterNames || []).map(c => '<span class="chip">' + esc(c) + '</span>').join('');
    let chips;
    if (p) chips = '<span class="chip">' + esc(p.dur) + '</span>' + (p.face ? '<span class="chip chip-face-yes">Face</span>' : '<span class="chip">No face</span>') + who;
    else chips = (s.duration ? '<span class="chip">' + esc(String(s.duration)) + ' s</span>' : '') + who;
    const title = p ? '<span class="code">' + esc(p.code) + '</span>' + esc(p.size) : esc(s.sceneName);
    html += '<div class="shot' + (selectedScene === num ? ' selected' : '') + '" data-num="' + esc(num) + '">' +
      '<input type="checkbox" class="scene-check" value="' + esc(num) + '"' + (pickedScenes.has(num) ? ' checked' : '') + ' aria-label="Select scene ' + esc(num) + '">' +
      '<span class="shot-num">' + esc(num) + '</span>' +
      '<div><div class="shot-title">' + title + '</div><div class="shot-chips">' + chips + '</div><div class="shot-prompt">' + esc((s.imagePrompt || '').slice(0, 160)) + '</div></div>' +
      '<div class="shot-side">' + typeTag + status + '</div></div>';
  });
  el.innerHTML = html;

  const all = document.getElementById('selAll');
  all.checked = picked === scenes.length && picked > 0;
  all.indeterminate = picked > 0 && picked < scenes.length;
  el.querySelectorAll('.grp-check').forEach(cb => {
    const nums = (groupIndex[cb.dataset.key] || { nums: [] }).nums;
    const c = nums.filter(n => pickedScenes.has(n)).length;
    cb.checked = c === nums.length && c > 0;
    cb.indeterminate = c > 0 && c < nums.length;
  });

  el.onchange = e => {
    const t = e.target;
    if (t.id === 'selAll') selectAll(t.checked);
    else if (t.classList.contains('grp-check')) { (groupIndex[t.dataset.key] || { nums: [] }).nums.forEach(n => t.checked ? pickedScenes.add(n) : pickedScenes.delete(n)); renderLeft(); }
    else if (t.classList.contains('scene-check')) { t.checked ? pickedScenes.add(t.value) : pickedScenes.delete(t.value); renderLeft(); }
  };
  el.onclick = e => {
    if (e.target.dataset && e.target.dataset.act === 'first6') { pickedScenes = new Set(scenes.slice(0, 6).map(x => x.sceneNumber)); renderLeft(); return; }
    if (e.target.matches('input, button')) return;
    const row = e.target.closest('.shot');
    if (row) selectScene(row.dataset.num, true);
  };
}

function renderChars(el) {
  el.onclick = el.onchange = null;
  const locked = engineState === 'running' || engineState === 'stopping';
  const cards = characters.map(c => {
    const idq = encodeURIComponent(c.id).replace(/'/g, '%27');
    const thumb = c.photoUrl ? '<img src="' + c.photoUrl + '" alt="Photo of ' + esc(c.name) + '">' : (c.photoSource === 'excel' ? 'Photo from<br>Excel path' : 'Drop a photo<br>or click');
    const badge = c.photoSource === 'upload' ? '<span class="photo-badge photo-ok">✓ Uploaded</span>'
      : c.photoSource === 'excel' ? '<span class="photo-badge photo-excel">From Excel path</span>'
      : c.photoSource === 'missing' ? '<span class="photo-badge photo-none">Excel path not found</span>'
      : '<span class="photo-badge photo-none">No photo</span>';
    const extra = (c.photoSource === 'excel' || c.photoSource === 'missing') ? '<div class="photo-path">' + esc(c.excelPhotoPath) + (c.photoSource === 'missing' ? '<br>That file does not exist. Upload a photo here instead.' : '') + '</div>'
      : (!c.photoSource && c.promptHeadshot ? '<div class="photo-path">Flow will generate a headshot from the prompt.</div>' : '')
      + (!c.photoSource && !c.promptHeadshot ? '<div class="photo-path">The face will not be locked and may differ between scenes.</div>' : '');
    const dis = locked ? ' disabled' : '';
    const role = c.role && c.role !== c.name ? ' · ' + esc(c.role) : '';
    return '<div class="person">' +
      '<div class="photo-drop" id="drop-' + esc(c.id) + '" title="JPG, PNG or WebP, up to 15 MB"' + (locked ? '' : ' role="button" tabindex="0" aria-label="Upload photo for ' + esc(c.name) + '" onclick="pickPhoto(\'' + idq + '\')" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();pickPhoto(\'' + idq + '\')}"') + '>' + thumb + '</div>' +
      '<div class="person-info"><div><span class="person-name">' + esc(c.name) + '</span><span class="person-id">#' + esc(c.id) + role + '</span></div>' + badge + extra +
        '<div class="photo-actions">' +
          '<button' + dis + ' onclick="pickPhoto(\'' + idq + '\')">' + (c.photoSource === 'upload' ? 'Replace photo' : 'Upload photo') + '</button>' +
          (c.photoSource === 'upload' ? '<button' + dis + ' onclick="removePhoto(\'' + idq + '\')">Remove</button>' : '') +
        '</div></div></div>';
  }).join('');
  el.innerHTML = '<div class="photo-hint">Add a clear, front-facing portrait of each person. Uploaded photos take priority over the path in the Excel <em>Characters</em> sheet.</div>' +
    '<input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="onPhotoPicked(this)">' +
    '<div class="people">' + cards + '</div>';

    const d = document.getElementById('drop-' + c.id); if (!d || locked) return;
    d.addEventListener('dragover', e => { e.preventDefault(); d.classList.add('drag'); });
    d.addEventListener('dragleave', () => d.classList.remove('drag'));
    d.addEventListener('drop', e => { e.preventDefault(); d.classList.remove('drag'); const f = e.dataTransfer.files[0]; if (f) sendPhoto(c.id, f); });
  });
}

let photoTarget = null;
function pickPhoto(idEnc) { photoTarget = decodeURIComponent(idEnc); const inp = document.getElementById('photoInput'); inp.value = ''; inp.click(); }
function onPhotoPicked(inp) { const f = inp.files[0]; if (f && photoTarget !== null) sendPhoto(photoTarget, f); }

async function sendPhoto(charId, file) {
  if (file.size > 15 * 1024 * 1024) { showToast('Photo too large (max 15 MB)', 'error'); return; }
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) && !/\.(jpe?g|png|webp)$/i.test(file.name)) { showToast('Use a JPG, PNG or WebP image', 'error'); return; }
  const d = document.getElementById('drop-' + charId); if (d) d.innerHTML = 'Uploading…';
  try {
    const res = await fetch(apiUrl('photos/' + encodeURIComponent(charId)), { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: file });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Upload failed');
    showToast('Photo uploaded (' + data.width + '×' + data.height + ')', 'success');
    (data.warnings || []).forEach(w => showToast(w, 'info', 7000));
  } catch (e) { showToast(e.message, 'error'); }
  await loadFlowData();
}

async function removePhoto(idEnc) {
  const charId = decodeURIComponent(idEnc);
  try {
    const res = await fetch(apiUrl('photos/' + encodeURIComponent(charId)), { method: 'DELETE' });
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || 'Failed to remove');
    showToast('Photo removed', 'success');
  } catch (e) { showToast(e.message, 'error'); }
  await loadFlowData();
}

function selectScene(num, fromUser) {
  selectedScene = num;
  document.querySelectorAll('.shot').forEach(r => r.classList.toggle('selected', r.dataset.num === num));
  if (currentRightTab === 'detail') renderDetail();
  if (fromUser && window.matchMedia('(max-width: 900px)').matches) {
    const rp = document.getElementById('rightPanel'); if (rp) rp.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function renderRight() { currentRightTab === 'detail' ? renderDetail() : renderLog(); }

function stepperHtml(s, status) {
  const stages = s.type === 'AI-VID' ? ['Image', 'Video', 'Done'] : ['Image', 'Done'];
  let cur = -1;
  if (status.startsWith('image')) cur = 0; else if (status.startsWith('video')) cur = 1; else if (status === 'complete') cur = stages.length;
  const parts = stages.map((label, i) => {
    const cls = i < cur ? 'done' : i === cur ? 'now' : '';
    return '<span class="st ' + cls + '"><i>' + (cls === 'done' ? '✓' : '') + '</i>' + label + '</span>';
  });
  let html = '<div class="stepper">' + parts.join('<span class="bar"></span>') + '</div>';
  if (status === 'failed') html += '<div class="photo-path" style="color:var(--bad);margin-top:10px">This scene failed. Open the Log tab for the reason.</div>';
  return html;
}

function renderDetail() {
  const el = document.getElementById('rightContent');
  if (!el) return;
  const s = scenes.find(x => x.sceneNumber === selectedScene);
  if (!s) { el.innerHTML = '<div class="detail-content"><div class="detail-empty">Select a scene to see its prompts and progress.</div></div>'; return; }
  const tc = s.type === 'AI-VID' ? 'tag-vid' : s.type === 'AI-IMG' ? 'tag-img' : 'tag-stock';
  const status = sceneStatuses[s.sceneNumber] || 'waiting';
  const p = parseShot(s.sceneName);
  const eyebrow = p ? [p.code, p.chapter] : ['Scene ' + s.sceneNumber];
  const facts = [
    ['Ends at', esc((s.endTime || '').replace('p', ':') || '–')],
    ['Length', esc(p ? p.dur : (s.duration ? s.duration + ' s' : '–'))],
  ];
  if (p) facts.push(['Face', p.face ? 'Visible' : 'None']);
  facts.push(['Characters', esc((s.characterNames || []).join(', ') || 'None')]);
  const ta = (type, label, hint, value) => '<div class="detail-field"><label class="detail-label" for="ta-' + type + '">' + label + '<small>' + hint + '</small></label>' +
    '<textarea class="prompt-edit" id="ta-' + type + '" data-scene="' + esc(s.sceneNumber) + '" data-type="' + type + '">' + esc(value || '') + '</textarea></div>';

  el.innerHTML = '<div class="detail-content">' +
    '<div class="detail-eyebrow">' + eyebrow.map(esc).join(' · ') + ' <span class="tag ' + tc + '">' + esc(s.type) + '</span><span class="tag-step step-' + status + '">' + esc(status) + '</span></div>' +
    '<h2 class="detail-title">' + esc(p ? p.size : s.sceneName) + '</h2>' +
    '<div class="facts">' + facts.map(f => '<div class="fact"><div class="fact-label">' + f[0] + '</div><div class="fact-value">' + f[1] + '</div></div>').join('') + '</div>' +
    ta('image', s.type === 'AI-VID' ? 'First-frame prompt' : 'Image prompt', 'Saved when you click away', s.imagePrompt) +
    (s.type === 'AI-VID' ? ta('video', 'Video prompt (Veo)', 'Motion only', s.videoPrompt) : '') +
    '<div class="detail-field"><div class="detail-label">Progress</div>' + stepperHtml(s, status) + '</div>' +
  '</div>';
  el.querySelectorAll('.prompt-edit').forEach(t => {
    const grow = () => { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 2, 420) + 'px'; };
    grow(); t.addEventListener('input', grow);
    t.addEventListener('blur', async () => {
      try {
        const b = {}; b[t.dataset.type === 'image' ? 'imagePrompt' : 'videoPrompt'] = t.value;
        const res = await fetch(apiUrl('scenes/' + encodeURIComponent(t.dataset.scene)), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(b) });
        if (!res.ok) throw new Error('Failed to save prompt');
        showToast('Prompt saved', 'success', 2000);
      } catch (e) { showToast(e.message, 'error'); }
    });
  });
}

function renderLog() {
  const el = document.getElementById('rightContent');
  if (!el) return;
  el.innerHTML = '<div class="log-toolbar"><span>Live log</span><button class="btn-outline btn-sm" onclick="clearLog()">Clear</button></div><div class="log-content" id="logContent"></div>';
  const lc = document.getElementById('logContent');
  logEntries.forEach(e => appendLog(lc, e)); lc.scrollTop = lc.scrollHeight;
}

function addLog(entry) { logEntries.push(entry); if (logEntries.length > 500) logEntries.shift(); const lc = document.getElementById('logContent'); if (lc) { appendLog(lc, entry); lc.scrollTop = lc.scrollHeight; } }
function appendLog(c, e) { const l = document.createElement('div'); l.className = 'log-entry log-' + e.level; const ts = e.timestamp || new Date().toLocaleTimeString('vi-VN'); l.textContent = '[' + ts + '] ' + (e.scene ? '[#' + e.scene + '] ' : '') + e.message; c.appendChild(l); }
function clearLog() { logEntries = []; const lc = document.getElementById('logContent'); if (lc) lc.innerHTML = ''; }

function selectAll(c) { pickedScenes = c ? new Set(scenes.map(x => x.sceneNumber)) : new Set(); renderLeft(); }
function getSelectedScenes() { return scenes.map(x => x.sceneNumber).filter(n => pickedScenes.has(n)); }

async function doStart() {
  const sel = getSelectedScenes(); if (!sel.length) { showAlertDialog('No Selection', 'Select at least one scene'); return; }
  const missing = characters.filter(c => c.photoSource === 'missing').map(c => c.name);
  if (missing.length) { showAlertDialog('Photo not found', 'The Excel points to a photo file that does not exist for: ' + missing.join(', ') + '. Upload their photo in the Characters tab first.'); return; }
  const noFace = characters.filter(c => !c.photoSource && !c.promptHeadshot).map(c => c.name);
  if (noFace.length && !confirm('No reference photo for: ' + noFace.join(', ') + '.\nTheir faces will NOT be locked and will differ between scenes.\n\nStart anyway?')) return;
  const btn = document.getElementById('btnStart');
  await withLoading(btn, async () => {
    const res = await fetch(apiUrl('start'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scenes: sel, imageOnly: document.getElementById('imageOnly').checked, videoOnly: document.getElementById('videoOnly').checked, resume: document.getElementById('resume').checked, ratio: document.getElementById('ratio').value, genCount: parseInt(document.getElementById('genCount').value) }) });
    if (!res.ok) { const d = await res.json().catch(() => ({})); throw new Error(d.error || 'Failed to start'); }
    showToast('Flow started!', 'success');
  }, false);
}
async function doStop() {
  const btn = document.getElementById('btnStop');
  await withLoading(btn, async () => {
    const res = await fetch(apiUrl('stop'), { method: 'POST' });
    if (!res.ok) throw new Error('Failed to stop');
    showToast('Stopping...', 'info');
  }, false);
}

function updateState(state) {
  engineState = state; const b = document.getElementById('statusBadge');
  if (b) { b.textContent = statusLabel(state); b.className = 'status-badge status-' + state; }
  if (currentTab === 'chars') renderLeft(); // khóa/mở nút ảnh theo trạng thái chạy
  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  if (btnStart) btnStart.disabled = state !== 'idle' || !scenes.length;
  if (btnStop) btnStop.disabled = state === 'idle';
  const bs = document.getElementById('bottomStats');
  if (bs) bs.textContent = state === 'idle' ? 'Ready' : state === 'running' ? 'Running…' : 'Stopping…';
}

function updateProgress(statuses) {
  if (!statuses) return; let done = 0, fail = 0;
  statuses.forEach(s => { sceneStatuses[s.sceneNumber] = s.step; if (s.step === 'complete') done++; if (s.step === 'failed') fail++; });
  const ps = document.getElementById('progressStats');
  if (ps) ps.innerHTML = statuses.length ? done + ' / ' + statuses.length + ' done' + (fail ? ' · ' + fail + ' failed' : '') + '<i><b style="width:' + Math.round(done / statuses.length * 100) + '%"></b></i>' : '';
  renderLeft(); if (selectedScene && currentRightTab === 'detail') renderDetail();
}

async function loadResults() {
  if (!currentFlowId) return;
  const res = await fetch(apiUrl('output')); const files = await res.json(); const bar = document.getElementById('resultsBar');
  if (!bar) return;
  if (!files.length) { bar.innerHTML = ''; return; }
  bar.innerHTML = '<h4>Output:</h4><button class="btn-outline btn-sm" onclick="downloadZip()" title="Download all as ZIP">⬇ ZIP</button>' + files.map(f => f.type === 'video' ? '<video src="' + apiUrl('output/' + f.name) + '" class="result-thumb" onclick="showMedia(\'video\',\'' + f.name + '\')" muted></video>' : '<img src="' + apiUrl('output/' + f.name) + '" class="result-thumb" onclick="showMedia(\'image\',\'' + f.name + '\')">').join('');
}

function downloadZip() {
  const a = document.createElement('a');
  a.href = apiUrl('output/zip');
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
  showToast('Downloading ZIP...', 'info', 2000);

function closeModal() { document.getElementById('modal').classList.remove('active'); document.getElementById('modalContent').innerHTML = ''; }

// ─── Notification & Sound ─────────────────────────────────
function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function playCompletionSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const playTone = (freq, start, dur) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq; osc.type = 'sine';
      gain.gain.setValueAtTime(0.3, ctx.currentTime + start);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + start + dur);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur);
    };
    playTone(587.33, 0, 0.3);
    playTone(880, 0.15, 0.4);
    playTone(1174.66, 0.3, 0.5);
  } catch (e) {}
}

function playErrorSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 220; osc.type = 'sine';
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
    osc.start(); osc.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}

function showBrowserNotification(title, body) {
  if ('Notification' in window && Notification.permission === 'granted') {
    const n = new Notification(title, {
      body,
      icon: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28"%3E%3Crect x="3" y="10" width="22" height="15" rx="3" fill="%238c2f5b"/%3E%3Cpath d="m11 14.5 6 3.5-6 3.5z" fill="%23fff"/%3E%3C/svg%3E',
    });
    n.onclick = () => { window.focus(); n.close(); };
    setTimeout(() => n.close(), 8000);
  }
}

function onFlowComplete(result) {
  playCompletionSound();
  showBrowserNotification('GG Flow Complete!', result.completed + '/' + result.total + ' scenes completed' + (result.failed ? ', ' + result.failed + ' failed' : ''));

  // Flash title
  const originalTitle = document.title;
  const flashInterval = setInterval(() => {
    document.title = document.title === originalTitle ? '✅ Flow Complete!' : originalTitle;
  }, 1000);
  const stopFlash = () => { clearInterval(flashInterval); document.title = originalTitle; window.removeEventListener('focus', stopFlash); };
  window.addEventListener('focus', stopFlash);
  setTimeout(stopFlash, 30000);
}

function onFlowError(msg) {
  playErrorSound();
  showBrowserNotification('GG Flow Error', msg);
}

function connectFlowSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource(apiUrl('events'));
  eventSource.addEventListener('log', e => addLog(JSON.parse(e.data)));
  eventSource.addEventListener('progress', e => updateProgress(JSON.parse(e.data)));
  eventSource.addEventListener('state', e => updateState(JSON.parse(e.data).state));
  eventSource.addEventListener('run-complete', e => { const r = JSON.parse(e.data); addLog({ level: 'success', message: 'Done! ' + r.completed + ' completed, ' + r.failed + ' failed' }); loadResults(); showToast('Done! ' + r.completed + '/' + r.total + ' completed', 'success', 5000); onFlowComplete(r); });
  eventSource.addEventListener('engine-error', e => { const msg = JSON.parse(e.data); addLog({ level: 'error', message: msg }); showToast(msg, 'error', 5000); onFlowError(msg); });
  eventSource.onerror = () => { setTimeout(() => { if (currentFlowId) connectFlowSSE(); }, 3000); };
}

      '<button class="btn-outline" onclick="closeDialog()">Cancel</button>' +

    '</div>'
  );
  document.getElementById('dialogConfirm').onclick = () => { closeDialog(); onConfirm(); };
}

// Boot
route();
</script>
